spring.application.name=zelacidade

# Porta: no Azure App Service (Linux) a variável PORT é definida como 80; localmente usa 8080
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Banco de dados (Azure SQL)
# NENHUMA credencial fica no código: os valores vêm de variáveis de
# ambiente configuradas no App Service pela Release (Azure Pipelines).
#   DB_URL      -> jdbc:sqlserver://<servidor>.database.windows.net:1433;database=<banco>;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
#   DB_USERNAME -> usuário administrador do SQL Server
#   DB_PASSWORD -> senha (variável secreta na pipeline)
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# As tabelas são criadas pelo scripts/script-bd.sql (DDL), não pelo Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Health check
management.endpoints.web.exposure.include=health,info
